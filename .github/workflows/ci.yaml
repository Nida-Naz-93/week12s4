name: ci-wf
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: welcome step
        run: echo "Welcome to linting"
      - name: clone repostiroy
        uses: actions/checkout@v4
      - name: Install HtML hint
        run: npm install --save-dev htmlhint
      - name: lint HTML
        run: npx htmlhint "**/*.html"
        